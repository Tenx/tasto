<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>TASTO 图片管理</title>
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回 TASTO 首页">TASTO</a>
    <div class="topbar-meta">
      <span class="environment">IMAGE ADMIN</span>
      <button id="logout-button" class="text-button" type="button" hidden>退出登录</button>
    </div>
  </header>

  <main>
    <section id="login-panel" class="login-panel" hidden>
      <form id="login-form" class="login-card">
        <p class="eyebrow">PRIVATE ACCESS</p>
        <h1>图片管理后台</h1>
        <p class="muted">输入管理员密码后管理 TASTO 前端图片。</p>
        <label for="password">管理员密码</label>
        <input id="password" name="password" type="password" minlength="12" autocomplete="current-password" required>
        <button class="primary-button" type="submit">登录</button>
        <p id="login-message" class="form-message" role="status"></p>
      </form>
    </section>

    <section id="admin-panel" class="admin-shell" hidden>
      <div class="page-heading">
        <div>
          <p class="eyebrow">TASTO CATALOG</p>
          <h1>图片与菜单目录</h1>
          <p class="muted">保存为“前端显示”后，最多约 30 秒同步到网站。</p>
        </div>
        <div class="stats" aria-live="polite">
          <span id="total-count">0 张图片</span>
          <span id="published-count">0 张已发布</span>
        </div>
      </div>

      <!-- 视图 A: 目录网格（默认） -->
      <div id="dir-view">
        <div class="dir-toolbar">
          <input id="dir-search" type="search" placeholder="搜索风格目录" aria-label="搜索目录">
        </div>
        <div id="dir-groups"></div>
      </div>

      <!-- 视图 B: 单目录详情 + 批量上传（默认 hidden） -->
      <div id="folder-view" hidden>
        <button id="back-to-dirs" class="text-button" type="button">← 返回全部目录</button>
        <div class="folder-head">
          <h2 id="folder-title"></h2>
          <p id="folder-sub" class="muted"></p>
          <button id="tier-toggle" class="tier-toggle" type="button" hidden></button>
        </div>
        <div id="dropzone" class="dropzone" tabindex="0" role="button">
          <p>把图片拖到这里，或点击选择（可多选）</p>
          <p class="muted">JPG / PNG / WebP / AVIF / GIF，单张 ≤ 4 MB</p>
          <input id="folder-file" type="file" accept="image/jpeg,image/png,image/webp,image/avif,image/gif" multiple hidden>
        </div>
        <ul id="upload-queue" class="upload-queue" aria-live="polite"></ul>
        <div id="folder-images" class="image-list" aria-live="polite"></div>
        <div id="folder-empty" class="empty-state" hidden>这个目录还没有图片，拖图上传吧。</div>
      </div>
    </section>
  </main>
</body>
</html>
